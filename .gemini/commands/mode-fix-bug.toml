description="Diagnose and fix a bug in a Vanilla HTML/CSS/JS project. Identifies the correct layer, reads minimum files, and applies a targeted fix."
prompt = """
Włącz tryb naprawiania błędów (Vanilla HTML/CSS/JS).

Opis problemu: {{args}}

## Krok 1 — Określ warstwę

| Objaw | Zacznij tutaj |
|-------|---------------|
| Zły tekst / kopia | `index.html` lub odpowiedni plik HTML |
| Problem wizualny / layout | `src/css/*.css` |
| Zepsuta animacja / przejście | CSS `@keyframes`/`transition` lub JS IntersectionObserver |
| Formularz nie działa | `src/js/*.js` + markup formularza |
| Menu mobilne / nawigacja | `src/js/*.js` (burger menu) + CSS |
| Błąd build output | Uruchom `npm run minify:css` / `npm run minify:js` |
| Obraz się nie ładuje | Sprawdź ścieżki: `assets/img/originals/` vs `assets/img/optimized/` |

## Krok 2 — Czytaj minimum plików

Czytaj TYLKO podejrzany plik. Użyj grep do znalezienia problemu.

## Krok 3 — Diagnoza (1-2 zdania)

## Krok 4 — Naprawa

- Celna edycja — zmień tylko co jest zepsute
- Nie refaktoryzuj otaczającego kodu
- Tylko pliki źródłowe: nigdy `.min.css` / `.min.js`

## Krok 5 — Weryfikacja

Uruchom `npm run minify:css && npm run minify:js`.
"""
