description="Scaffold a new section or module for a Vanilla HTML/CSS/JS project — HTML markup, CSS styles, optional JS initialization."
prompt = """
Utwórz nową sekcję/moduł dla projektu Vanilla HTML/CSS/JS.

Opis: {{args}}

## HTML (dodaj do index.html)

```html
<section id="section-name" class="section-name" aria-labelledby="section-name-heading">
  <div class="section-name__container">
    <h2 id="section-name-heading" class="section-name__title">Tytuł sekcji</h2>
    <!-- treść -->
  </div>
</section>
```

## CSS (dodaj do src/css/style.css)

```css
.section-name {
  padding: var(--spacing-lg) 0;
}

.section-name__container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--spacing-md);
}

.section-name__title {
  font-size: clamp(1.75rem, 3vw, 2.5rem);
  color: var(--color-text);
  margin-bottom: var(--spacing-md);
}

@media (min-width: 768px) { }
@media (min-width: 1024px) { }
```

## JS (dodaj do src/js/main.js — tylko gdy potrzebna interakcja)

```js
function initSectionName() {
  const elements = document.querySelectorAll('.section-name__item');
  if (!elements.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  elements.forEach(el => observer.observe(el));
}

document.addEventListener('DOMContentLoaded', () => { initSectionName(); });
```

## Konwencje

- BEM: `.block__element--modifier`
- Kolory/spacing: zmienne `:root`
- Mobile-first: base → 768px → 1024px → 1440px
- Po scaffoldingu: `npm run minify:css && npm run minify:js`
"""
