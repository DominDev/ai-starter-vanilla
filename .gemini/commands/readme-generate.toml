description="Generate professional README.md and LICENSE for the project (DominDev branding, tech stack, features, setup)."
prompt = """
Wygeneruj profesjonalne README.md i LICENSE dla tego projektu.

## Faza analizy

1. Skanuj projekt: glob HTML/CSS/JS/JSON, czytaj `package.json`
2. Wykryj stack (HTML5/CSS3/Vanilla JS), funkcje, performance hints, dostępność
3. Wyciągnij nazwę projektu i metadane

## Sekcje README (w kolejności)

1. Hero — odznaki, tabela quick stats
2. Preview — screenshoty desktop/mobile
3. About & Features — tabela funkcji z impaktem, macierz porównawcza
4. Tech Stack — odznaki (HTML5, CSS3, JS, npm), tabela porównawcza stacka
5. Performance — wyniki Lighthouse, tabela ASCII Core Web Vitals
6. Accessibility — tabela zgodności WCAG
7. Getting Started — wymagania, quick start (3 kroki), struktura projektu
8. Lessons Learned — co działało, wyzwania, retrospektywa
9. Deployment — porównanie hostingów, komendy deploy
10. Roadmap — tabela priorytetów ze statusem
11. License — tabela dual license (MIT kod / ARR assety)
12. Author — blok brandingowy DominDev

## LICENSE

Wygeneruj dual license: MIT (kod) + All Rights Reserved (assety).
Autor: DominDev, rok: 2026.

## Output

1. Backup istniejącego README.md do `README.backup.md`
2. Zapisz `README.md` i `LICENSE` do root projektu
3. Pokaż summary: wykryty stack, funkcje, wygenerowane sekcje

## Zasady

- Używaj rzeczywistych danych projektu — nie wymyślaj metryk
- Pewny, odważny ton (Senior Developer)
- Wizualnie: emoji grids, tabele porównawcze, ASCII boxes
- DominDev brand: kolor #FF1F1F, styl odznak `for-the-badge`
- Tagline: "Building digital experiences that convert."
"""
